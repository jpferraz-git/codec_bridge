[project]
name = "codec_bridge"
version = "0.1.0
description = "Detecta encoding e delimitador de arquivos CSV para uso com DuckDB"
authors = [
    { name = "João Pedro Ferraz Bezerra", email = "jpferraz554@gmail.com" }
]
license = "MIT"
readme = "README.md
requires-python = ">=3.10"

dependencies = [
    "charset-normalizer>=3.4.2",
    "duckdb>=1.3.2"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"